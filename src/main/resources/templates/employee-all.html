<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:replace="fragments/head"/>
<body>
<div th:replace="fragments/navbar"></div>

<main class="container my-4">
    <div class="row mb-4">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="d-flex flex-column flex-md-row gap-3 align-items-md-center">
                        <div class="d-flex flex-wrap gap-2 align-items-center">
                            <span class="fw-bold">Подразделение:</span>
                            <a href="/employees/all"
                               th:class="${selectedDepartment == null} ? 'btn btn-primary btn-sm' : 'btn btn-outline-secondary btn-sm'">
                                Все
                            </a>
                            <a th:each="dept : ${departments}"
                               th:href="@{/employees/all?department={id}(id=${dept.id})}"
                               th:class="${selectedDepartment != null and selectedDepartment == dept.id} ? 'btn btn-primary btn-sm' : 'btn btn-outline-secondary btn-sm'"
                               th:text="${dept.shortName}">
                            </a>
                        </div>

                        <form method="get" action="/employees/all" id="searchForm" class="flex-grow-1">
                            <div class="input-group">
                                <input type="search"
                                       name="search"
                                       th:value="${search}"
                                       placeholder="Поиск сотрудников..."
                                       th:attr="placeholder=${selectedDepartment != null} ? 'Поиск в подразделении...' : 'Поиск сотрудников...'"
                                       class="form-control"
                                       id="searchInput"
                                       autocomplete="off">
                                <input type="hidden"
                                       name="department"
                                       th:value="${selectedDepartment}"
                                       id="departmentHidden">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-search"></i> Найти
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="resultsContainer">
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div th:each="e : ${allEmployees}" class="col">
                <div class="card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title text-primary fw-bold mb-2"
                            th:text="${e.lastName} + ' ' + ${e.firstName} + ' ' + ${e.middleName}">
                        </h5>

                        <h6 class="card-subtitle text-muted mb-3"
                            th:text="${e.departmentShortName}">
                        </h6>

                        <div class="mt-2" style="font-size: 0.9rem;">
                            <p th:if="${e.officeNumber}" class="mb-1">
                                <i class="bi bi-door-closed text-secondary"></i>
                                <strong>Кабинет:</strong> <span th:text="${e.officeNumber}"></span>
                            </p>
                            <p th:if="${e.workPhone}" class="mb-1">
                                <i class="bi bi-telephone text-secondary"></i>
                                <strong>Рабочий:</strong>
                                <a th:href="'tel:' + ${#strings.replace(e.workPhone, ' ', '')}"
                                   th:text="${e.workPhone}"
                                   class="text-decoration-none">
                                </a>
                            </p>
                            <p th:if="${e.personalPhone}" class="mb-1">
                                <i class="bi bi-phone text-secondary"></i>
                                <strong>Личный:</strong>
                                <a th:href="'tel:' + ${#strings.replace(e.personalPhone, ' ', '')}"
                                   th:text="${e.personalPhone}"
                                   class="text-decoration-none">
                                </a>
                            </p>
                            <p th:if="${e.email}" class="mb-1">
                                <i class="bi bi-envelope text-secondary"></i>
                                <strong>Email:</strong>
                                <a th:href="'mailto:' + ${e.email}"
                                   th:text="${e.email}"
                                   class="text-decoration-none">
                                </a>
                            </p>
                            <p th:if="${e.additionalInfo}" class="mb-1">
                                <i class="bi bi-telegram text-secondary"></i>
                                <strong>Telegram:</strong>
                                <a th:href="'https://t.me/' + ${e.additionalInfo}"
                                   th:text="'@' + ${e.additionalInfo}"
                                   class="text-decoration-none">
                                </a>
                            </p>
                            <p th:if="${e.statusNote}" class="mb-1">
                                <i class="bi bi-info-circle text-secondary"></i>
                                <strong>Доп. инфо:</strong>
                                <span th:text="${e.statusNote}" class="text-muted"></span>
                            </p>
                        </div>

                        <div th:if="${isAdmin or (isModerator and userDepartmentId == e.departmentId)}"
                             class="mt-3 pt-2 border-top">
                            <div class="d-flex gap-2">
                                <form th:action="@{/employees/update/{id}(id=${e.id})}"
                                      th:method="get" class="flex-grow-1">
                                    <button type="submit" class="btn btn-warning btn-sm w-100">
                                        <i class="bi bi-pencil"></i> Изменить
                                    </button>
                                </form>
                                <form th:action="@{/employees/delete/{id}(id=${e.id})}"
                                      th:method="post"
                                      onsubmit="return confirm('Вы уверены, что хотите удалить сотрудника?')"
                                      class="flex-grow-1">
                                    <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                                        <i class="bi bi-trash"></i> Удалить
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(allEmployees)}" class="alert alert-info text-center mt-4">
            <i class="bi bi-people fs-1"></i>
            <h4 class="mt-2">Сотрудники не найдены</h4>
            <p class="mb-0">
                <span th:if="${selectedDepartment != null}">
                    В выбранном подразделении нет сотрудников.
                </span>
                <span th:unless="${selectedDepartment != null}">
                    Введите запрос в поиск или выберите подразделение.
                </span>
            </p>
        </div>
    </div>
</main>

<footer th:replace="fragments/footer"></footer>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');
        const departmentHidden = document.getElementById('departmentHidden');
        let debounceTimer;

        function performSearch() {
            const cursorPosition = searchInput.selectionStart;
            const searchValue = searchInput.value;
            const url = new URL(window.location.origin + '/employees/all');

            if (searchValue.trim() !== '') {
                url.searchParams.set('search', searchValue);
            }
            if (departmentHidden && departmentHidden.value) {
                url.searchParams.set('department', departmentHidden.value);
            }

            fetch(url, {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
            .then(response => response.text())
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const newResultsContainer = doc.getElementById('resultsContainer');
                if (newResultsContainer) {
                    resultsContainer.innerHTML = newResultsContainer.innerHTML;
                }
                searchInput.focus();
                searchInput.setSelectionRange(cursorPosition, cursorPosition);
            })
            .catch(error => console.error('Ошибка при поиске:', error));
        }

        searchInput.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            if (this.value.trim() === '') {
                performSearch();
            } else {
                debounceTimer = setTimeout(() => performSearch(), 500);
            }
        });

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                clearTimeout(debounceTimer);
                performSearch();
            }
        });

        searchInput.focus();
    });
</script>
</body>
</html>
