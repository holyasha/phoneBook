<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:replace="fragments/head"/>
<body>
<div th:replace="fragments/navbar"></div>

<main class="container my-4">
    <div class="row mb-4">
        <div class="col">
            <h1 class="display-5 fw-bold text-primary">Все подразделения</h1>
            <hr>
        </div>
    </div>

    <div id="resultsContainer">
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div th:each="department : ${allDepartments}" class="col">
                <div class="card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <h3 class="card-title text-primary fw-bold" th:text="${department.shortName}"></h3>

                        <p class="card-text text-muted mb-4"
                           th:text="${department.fullName}"
                           style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                        </p>

                        <div class="mt-auto">
                            <div class="d-grid gap-2">
                                <form th:action="@{/departments/update/{id}(id=${department.id})}"
                                      th:method="get" class="w-100">
                                    <button type="submit" class="btn btn-warning w-100 py-2">
                                        <i class="bi bi-pencil"></i> Изменить
                                    </button>
                                </form>

                                <form th:action="@{/departments/delete/{id}(id=${department.id})}"
                                      th:method="delete"
                                      onsubmit="return confirm('Вы уверены, что хотите удалить подразделение «' +
                                                (${department.shortName} ? ${department.shortName} : '') + '»?')"
                                      class="w-100">
                                    <button type="submit" class="btn btn-outline-danger w-100 py-2">
                                        <i class="bi bi-trash"></i> Удалить
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(allDepartments)}" class="alert alert-info text-center mt-4">
            <i class="bi bi-building fs-1"></i>
            <h4 class="mt-2">Подразделения не найдены</h4>
            <p class="mb-0">Добавьте новые подразделения, чтобы начать!</p>
        </div>
    </div>
</main>

<footer th:replace="fragments/footer"></footer>
</body>
</html>
