<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head"/>
<body>
<div th:replace="fragments/navbar"></div>

<main class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h2 class="h4 mb-0">Добавление подразделения</h2>
                    <p class="mb-0 small opacity-75">Заполните информацию о подразделении</p>
                </div>

                <div class="card-body">
                    <form th:action="@{/departments/add}"
                          th:method="post"
                          th:object="${departmentModel}">

                        <div class="row g-3 mb-3">
                            <div class="col-12">
                                <label for="shortName" class="form-label fw-bold">Аббревиатура <span class="text-danger">*</span></label>
                                <input th:field="*{shortName}"
                                       th:errorclass="is-invalid"
                                       type="text"
                                       class="form-control"
                                       id="shortName"
                                       placeholder="Введите аббревиатуру"
                                       required>
                                <div th:if="${#fields.hasErrors('shortName')}"
                                     th:errors="*{shortName}"
                                     class="invalid-feedback"></div>
                            </div>

                            <div class="col-12">
                                <label for="fullName" class="form-label fw-bold">Полное название <span class="text-danger">*</span></label>
                                <input th:field="*{fullName}"
                                       th:errorclass="is-invalid"
                                       type="text"
                                       class="form-control"
                                       id="fullName"
                                       placeholder="Введите полное название"
                                       required>
                                <div th:if="${#fields.hasErrors('fullName')}"
                                     th:errors="*{fullName}"
                                     class="invalid-feedback"></div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Выберите тип <span class="text-danger">*</span></label>
                            <div class="d-flex flex-column flex-sm-row gap-2 gap-sm-3">
                                <div class="form-check">
                                    <input th:field="*{type}"
                                           th:value="DEPARTMENT"
                                           type="radio"
                                           class="form-check-input"
                                           id="typeDepartment">
                                    <label class="form-check-label" for="typeDepartment">
                                        Кафедра
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input th:field="*{type}"
                                           th:value="ADMINISTRATION"
                                           type="radio"
                                           class="form-check-input"
                                           id="typeAdministration">
                                    <label class="form-check-label" for="typeAdministration">
                                        Администрация
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input th:field="*{type}"
                                           th:value="OFFICE"
                                           type="radio"
                                           class="form-check-input"
                                           id="typeOffice">
                                    <label class="form-check-label" for="typeOffice">
                                        Отдел
                                    </label>
                                </div>
                            </div>
                            <div th:if="${#fields.hasErrors('type')}"
                                 th:errors="*{type}"
                                 class="text-danger small mt-1"></div>
                        </div>

                        <div class="row g-2 mt-4">
                            <div class="col-6">
                                <button type="submit" class="btn btn-primary w-100" style="height: 80px;">
                                    Добавить подразделение
                                </button>
                            </div>
                            <div class="col-6">
                                <a href="/departments/all" class="btn btn-secondary w-100 d-flex align-items-center justify-content-center" style="height: 80px;">
                                    Отменить
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="fragments/footer"></footer>
</body>
</html>
