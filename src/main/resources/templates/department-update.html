<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head"/>
<body>
<div th:replace="fragments/navbar"></div>

<main class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h3 class="card-title mb-0">Изменение подразделения</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{'/departments/update/' + ${id}}"
                          th:method="post"
                          th:object="${departmentModel}">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Аббревиатура <span class="text-danger">*</span></label>
                            <input th:field="*{shortName}"
                                   type="text"
                                   class="form-control"
                                   required>
                            <div th:errors="*{shortName}" class="text-danger small"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Полное название <span class="text-danger">*</span></label>
                            <input th:field="*{fullName}"
                                   type="text"
                                   class="form-control"
                                   required>
                            <div th:errors="*{fullName}" class="text-danger small"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Тип подразделения <span class="text-danger">*</span></label>
                            <div class="d-flex flex-wrap gap-3">
                                <div class="form-check">
                                    <input th:field="*{type}" th:value="DEPARTMENT" type="radio" class="form-check-input" id="typeDept">
                                    <label class="form-check-label" for="typeDept">Кафедра</label>
                                </div>
                                <div class="form-check">
                                    <input th:field="*{type}" th:value="ADMINISTRATION" type="radio" class="form-check-input" id="typeAdmin">
                                    <label class="form-check-label" for="typeAdmin">Администрация</label>
                                </div>
                                <div class="form-check">
                                    <input th:field="*{type}" th:value="OFFICE" type="radio" class="form-check-input" id="typeOff">
                                    <label class="form-check-label" for="typeOff">Отдел</label>
                                </div>
                            </div>
                            <div th:errors="*{type}" class="text-danger small"></div>
                        </div>

                        <div class="row g-2 mt-4">
                            <div class="col-6">
                                <button type="submit" class="btn btn-primary w-100" style="height: 48px;">Сохранить</button>
                            </div>
                            <div class="col-6">
                                <a href="/departments/all" class="btn btn-secondary w-100 d-flex align-items-center justify-content-center" style="height: 48px;">Отменить</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="fragments/footer"></footer>
</body>
</html>
