<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:replace="fragments/head"/>
<body>
<div th:replace="fragments/navbar"></div>

<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="display-5 fw-bold text-primary">Все пользователи</h1>
        <span class="badge bg-secondary fs-6" th:text="${#lists.size(allUsers)} + ' пользователей'"></span>
    </div>
    <hr>

    <div id="resultsContainer">
        <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
            <div th:each="user : ${allUsers}" class="col">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-header bg-primary text-white">
                        <i class="bi bi-person-circle"></i>
                        <strong th:text="${user.username}"></strong>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <span class="text-muted">Подразделение:</span>
                            <strong class="ms-2" th:text="${user.departmentShortName}"></strong>
                        </div>
                        <div class="mb-3">
                            <span class="text-muted">Роль:</span>
                            <strong class="ms-2" th:text="${user.role}"></strong>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent">
                        <div class="d-flex gap-2">
                            <form th:action="@{/moderators/update/{id}(id=${user.id})}"
                                  th:method="get" class="flex-grow-1">
                                <button type="submit" class="btn btn-outline-primary w-100">
                                   Редактировать
                                </button>
                            </form>

                            <form th:action="@{/moderators/delete/{id}(id=${user.id})}"
                                  th:method="post"
                                  onsubmit="return confirm('Вы уверены, что хотите удалить пользователя ${user.username}?')"
                                  class="flex-grow-1">
                                <button type="submit" class="btn btn-outline-danger w-100">
                                    Удалить
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(allUsers)}" class="alert alert-info text-center mt-5">
            <h4 class="mt-2">Пользователи не найдены</h4>
            <p class="mb-0">Добавьте новых пользователей, чтобы начать!</p>
        </div>
    </div>
</main>

<footer th:replace="fragments/footer"></footer>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</body>
</html>
